name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # 创建 Release 需要

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Import signing cert (optional)
        env:
          WINMOUSE_DEV_P12: ${{ secrets.WINMOUSE_DEV_P12 }}
          WINMOUSE_DEV_PASSWORD: ${{ secrets.WINMOUSE_DEV_PASSWORD }}
        run: |
          if [ -z "$WINMOUSE_DEV_P12" ]; then
            echo "未配置 WINMOUSE_DEV_P12 secret → ad-hoc 签名（更新后需重新授予辅助功能权限）"
            exit 0
          fi
          KEYCHAIN=ci-sign.keychain-db
          security create-keychain -p ci "$KEYCHAIN"
          echo "$WINMOUSE_DEV_P12" | base64 -d > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$WINMOUSE_DEV_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychain -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN" >/dev/null
          rm -f /tmp/cert.p12

      - name: Build & package (arm64 + x86_64)
        run: |
          chmod +x scripts/make_app.sh
          MAKE_APP_ARCHS="arm64 x86_64" ./scripts/make_app.sh

      - name: Verify
        run: |
          lipo -info build/WinMouse.app/Contents/MacOS/WinMouse
          codesign -dv build/WinMouse.app 2>&1 | head -4

      - name: Zip
        run: ditto -c -k --sequesterRsrc --keepParent build/WinMouse.app build/WinMouse-macOS-universal.zip

      - name: Upload artifact
        continue-on-error: true # artifact 配额耗尽时仍应继续创建 Release
        uses: actions/upload-artifact@v4
        with:
          name: WinMouse-macOS-universal
          path: build/WinMouse-macOS-universal.zip

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/WinMouse-macOS-universal.zip
